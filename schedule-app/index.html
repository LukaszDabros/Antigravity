<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Zajęć WF - Szkoły Prezentek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            /* Subtle sporty background: dynamic diagonal stripes matching slightly with school theme (navy/white/blue) */
            background-image: repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.015) 0px,
                    rgba(255, 255, 255, 0.015) 2px,
                    transparent 2px,
                    transparent 10px);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 2px solid rgba(96, 165, 250, 0.2);
            /* Changed to blue-400 to match logo */
        }

        .gradient-text {
            /* Adjusted to school colors (Navy to Light Blue variant that still looks sporty) */
            background: linear-gradient(to right, #38bdf8, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sporty-badge {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            padding: 0.25rem 1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        .school-logo {
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
            transition: transform 0.3s ease;
        }

        .school-logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center p-4 sm:p-8 relative overflow-x-hidden">

    <!-- Subtle glow effects tuned to blue/cyan -->
    <div
        class="absolute top-[-100px] left-[-100px] w-96 h-96 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-100px] right-[-100px] w-96 h-96 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none">
    </div>

    <!-- Header -->
    <header
        class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center mb-8 gap-6 z-10 animate-fade-in">
        <div class="flex items-center gap-5">
            <!-- School Logo -->
            <a href="https://szkolyprezentekkrakow.pl/" target="_blank" rel="noopener noreferrer">
                <img src="logo.png" alt="Szkoły Prezentek Kraków" class="h-16 w-auto school-logo sm:h-20"
                    onerror="this.onerror=null; this.src='https://szkolyprezentekkrakow.pl/wp-content/uploads/elementor/thumbs/logo_2szkoly_medium-pgfqbz1chye81rtge62bkwv5uq6f3rh3djxt2o270g.png'">
            </a>

            <div class="hidden sm:block h-12 w-px bg-slate-700/80 rounded-full"></div>

            <div>
                <h1
                    class="text-3xl sm:text-4xl font-black gradient-text tracking-tighter uppercase italic drop-shadow-sm pr-2">
                    Grafik WF</h1>
                <p class="text-slate-400 mt-1 font-medium tracking-wide">Sezon 2025/2026</p>
            </div>
        </div>

        <!-- Controls -->
        <div
            class="glass-card p-3 sm:p-4 rounded-2xl flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto shadow-2xl">
            <div class="flex items-center gap-3">
                <button id="prevWeekBtn"
                    class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 hover:text-cyan-400 transition-colors text-slate-300 border border-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                </button>
                <div class="flex flex-col items-center min-w-[150px]">
                    <span id="weekInfoLabel"
                        class="text-xs font-bold text-cyan-400 uppercase tracking-widest sporty-badge bg-cyan-500/10 mb-1 inline-block border border-cyan-500/20">Tydzień
                        A</span>
                    <div class="flex items-center gap-2">
                        <span id="dateRangeLabel" class="text-sm text-slate-300 font-semibold tracking-wide">02.03 -
                            06.03</span>
                        <button id="settingsBtn" class="text-slate-500 hover:text-cyan-400 transition-colors p-1 rounded-full hover:bg-slate-800" title="Ustawienia cyklu">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
                <button id="nextWeekBtn"
                    class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 hover:text-cyan-400 transition-colors text-slate-300 border border-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
            <div class="h-8 w-px bg-slate-700 hidden sm:block"></div>
            <div
                class="flex items-center w-full sm:w-auto overflow-hidden rounded-xl border border-slate-700 bg-slate-800/50 p-1 hover:border-cyan-500/50 transition-colors">
                <input type="date" id="dateSelector"
                    class="w-full bg-transparent text-slate-200 px-3 py-1 font-medium focus:outline-none focus:text-cyan-400 transition-colors cursor-pointer">
            </div>
        </div>
    </header>

    <!-- Days Navigation -->
    <nav class="w-full max-w-5xl flex overflow-x-auto gap-3 mb-8 pb-3 snap-x z-10" id="daysNav">
        <!-- Populated by JS -->
    </nav>

    <!-- Schedule Content -->
    <main class="w-full max-w-5xl z-10" id="scheduleContainer">
        <!-- Populated by JS -->
    </main>

    <script>
        let scheduleData = {};
        let scheduleSha = '';
        // EMERGENCY RESET: Wklej w konsolę (F12), jeśli zapomnisz hasła:
        // localStorage.removeItem('rotation_seed'); location.reload();

        const daysENtoPL = {
            'monday': 'Poniedziałek', 'tuesday': 'Wtorek', 'wednesday': 'Środa', 'thursday': 'Czwartek', 'friday': 'Piątek'
        };

        const BASE_DATE = new Date('2026-03-02T00:00:00');
        let currentDate = new Date();
        let offset2 = 0;
        let offset3 = 0;
        let configSha = '';
        if (currentDate.getDay() === 0) {
            currentDate.setDate(currentDate.getDate() + 1);
        } else if (currentDate.getDay() === 6) {
            currentDate.setDate(currentDate.getDate() + 2);
        }
        let activeDay = 'monday';

        const prevWeekBtn = document.getElementById('prevWeekBtn');
        const nextWeekBtn = document.getElementById('nextWeekBtn');
        const dateSelector = document.getElementById('dateSelector');
        const weekInfoLabel = document.getElementById('weekInfoLabel');
        const dateRangeLabel = document.getElementById('dateRangeLabel');
        const daysNav = document.getElementById('daysNav');
        const scheduleContainer = document.getElementById('scheduleContainer');

        function getMonday(d) {
            d = new Date(d);
            var day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function updateState() {
            const currentMonday = getMonday(currentDate);
            const baseMonday = getMonday(BASE_DATE);
            const diffTime = currentMonday - baseMonday;
            let diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));

            let weekIndex2 = (((diffWeeks + offset2) % 2) + 2) % 2;
            let weekIndex3 = (((diffWeeks + offset3) % 3) + 3) % 3;

            // OVERRIDE WITH LOCAL SEED IF EXISTS
            const seedRaw = localStorage.getItem('rotation_seed');
            if (seedRaw) {
                try {
                    const seed = JSON.parse(seedRaw);
                    const localDiffTime = currentMonday - new Date(seed.baseDate);
                    const localDiffWeeks = Math.floor(localDiffTime / (1000 * 60 * 60 * 24 * 7));
                    const seedIdx = ((localDiffWeeks % seed.baseOrder.length) + seed.baseOrder.length) % seed.baseOrder.length;
                    
                    weekIndex2 = seedIdx % 2;
                    weekIndex3 = seedIdx % 3;
                    
                    weekInfoLabel.textContent = seed.baseOrder[seedIdx] || `Tydzień ${seedIdx + 1}`;
                } catch(e) {
                    console.error("Błąd seeda:", e);
                    weekInfoLabel.textContent = `2T: ${weekIndex2 + 1}  •  3T: ${weekIndex3 + 1}`;
                }
            } else {
                weekInfoLabel.textContent = `2T: ${weekIndex2 + 1}  •  3T: ${weekIndex3 + 1}`;
            }

            const friday = new Date(currentMonday);
            friday.setDate(friday.getDate() + 4);
            const formatDt = (dt) => dt.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
            dateRangeLabel.textContent = `${formatDt(currentMonday)} - ${formatDt(friday)}`;

            // Fix timezone issue when setting the date selector value
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(currentDate.getDate()).padStart(2, '0');
            dateSelector.value = `${year}-${month}-${day}`;

            const dayOfWeek = currentDate.getDay();
            const daysArray = Object.keys(scheduleData);
            activeDay = (dayOfWeek >= 1 && dayOfWeek <= 5) ? daysArray[dayOfWeek - 1] : 'monday';

            renderTabs();
            renderSchedule(weekIndex2, weekIndex3);
        }

        function renderTabs() {
            daysNav.innerHTML = '';
            Object.keys(scheduleData).forEach((day, index) => {
                const isActive = day === activeDay;
                const btn = document.createElement('button');
                
                const currentMonday = getMonday(currentDate);
                const tabDate = new Date(currentMonday);
                tabDate.setDate(currentMonday.getDate() + index);
                const dateStr = `${tabDate.getDate()}.${String(tabDate.getMonth() + 1).padStart(2, '0')}`;

                // Cyan/Blue theme for active tab
                btn.className = `flex flex-col items-center justify-center snap-start whitespace-nowrap px-6 py-2 rounded-xl font-bold uppercase text-sm tracking-wide transition-all duration-300 border-b-2 ${isActive ? 'bg-slate-800 border-cyan-400 text-cyan-400 shadow-[0_4px_20px_-4px_rgba(34,211,238,0.2)]' : 'bg-transparent border-transparent text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'}`;
                
                btn.innerHTML = `
                    <span class="text-[0.65rem] opacity-75 tracking-widest font-semibold">${dateStr}</span>
                    <span>${daysENtoPL[day]}</span>
                `;

                btn.onclick = () => {
                    const currentMonday = getMonday(currentDate);
                    const dayOffset = Object.keys(scheduleData).indexOf(day);
                    currentDate = new Date(currentMonday);
                    currentDate.setDate(currentMonday.getDate() + dayOffset);
                    updateState();
                };
                daysNav.appendChild(btn);
            });
        }

        function renderSchedule(w2, w3) {
            scheduleContainer.innerHTML = '';
            const dayData = scheduleData[activeDay] || [];

            if (dayData.length === 0) {
                scheduleContainer.innerHTML = '<div class="glass-card rounded-2xl text-center text-slate-500 py-16 font-medium text-lg italic">Brak zaplanowanych treningów</div>';
                return;
            }

            // Group adjacent identical lessons
            const mergedData = [];
            if (dayData.length > 0) {
                let current = { ...dayData[0] };
                let startNum = parseInt(current.lesson.replace('l.', ''));
                let endNum = startNum;

                for (let i = 1; i < dayData.length; i++) {
                    const next = dayData[i];
                    const nextNum = parseInt(next.lesson.replace('l.', ''));
                    
                    const isSame = JSON.stringify(current.teachers) === JSON.stringify(next.teachers);
                    const isAdjacent = nextNum === endNum + 1;

                    if (isSame && isAdjacent) {
                        endNum = nextNum;
                    } else {
                        mergedData.push({ 
                            displayLesson: startNum === endNum ? `${startNum}` : `${startNum}-${endNum}`,
                            teachers: current.teachers 
                        });
                        current = { ...next };
                        startNum = nextNum;
                        endNum = nextNum;
                    }
                }
                mergedData.push({ 
                    displayLesson: startNum === endNum ? `${startNum}` : `${startNum}-${endNum}`,
                    teachers: current.teachers 
                });
            }

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

            mergedData.forEach(lessonObj => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl rounded-tr-[2rem] p-6 hover:-translate-y-2 hover:shadow-[0_10px_30px_-10px_rgba(56,189,248,0.15)] transition-all duration-300';

                const header = document.createElement('div');
                header.className = 'flex items-center gap-3 mb-5 pb-4 border-b border-slate-700/50';
                header.innerHTML = `
          <div class="bg-blue-500/10 text-blue-400 p-2.5 rounded-xl border border-blue-500/20 shadow-inner">
             <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l3 3"/>
             </svg>
          </div>
          <h2 class="text-2xl font-black text-white italic tracking-tight uppercase">LEKCJA ${lessonObj.displayLesson}</h2>
        `;
                card.appendChild(header);

                const list = document.createElement('div');
                list.className = 'space-y-4';

                lessonObj.teachers.forEach((t, index) => {
                    let groupText = t.groups.length === 1 ? t.groups[0] :
                        (t.groups.length === 2 ? (t.groups[w2] || t.groups[0]) :
                            (t.groups[w3] || t.groups[0]));
                    if (!groupText) return;

                    const tItem = document.createElement('div');

                    // Alternating strong background colors based on index matching school theme
                    const bgClass = index % 2 === 0 ? 'bg-blue-900/40 shadow-sm' : 'bg-[rgba(108,33,110,0.6)]';

                    tItem.className = `${bgClass} rounded-xl rounded-l-none pl-4 pr-3 py-3 border ${index % 2 === 0 ? 'border-blue-500/30 border-l-cyan-500 hover:border-l-cyan-300 hover:bg-slate-800' : 'border-purple-600/30 border-l-purple-500 hover:border-l-pink-400 hover:bg-[rgba(108,33,110,0.8)]'} border-l-4 transition-all relative group overflow-hidden`;

                    tItem.innerHTML = `
            <div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-cyan-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${t.teacher}</span>
            </div>
            <div class="text-base font-semibold text-white group-hover:text-cyan-300 transition-colors">
              ${groupText}
            </div>
          `;
                    list.appendChild(tItem);
                });

                card.appendChild(list);
                grid.appendChild(card);
            });

            scheduleContainer.appendChild(grid);
        }

        prevWeekBtn.addEventListener('click', () => { currentDate.setDate(currentDate.getDate() - 7); updateState(); });
        nextWeekBtn.addEventListener('click', () => { currentDate.setDate(currentDate.getDate() + 7); updateState(); });
        dateSelector.addEventListener('change', (e) => { if (e.target.value) { currentDate = new Date(e.target.value); updateState(); } });

        // MODAL LOGIC
        const settingsOverlay = document.createElement('div');
        settingsOverlay.id = 'settingsOverlay';
        settingsOverlay.className = 'fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300';
        settingsOverlay.innerHTML = `
            <!-- Password Form -->
            <div id="passwordModal" class="glass-card p-6 rounded-2xl w-full max-w-sm m-4 shadow-2xl transform scale-95 transition-transform duration-300 relative">
                <button class="absolute top-4 right-4 text-slate-500 hover:text-white" onclick="closeModals()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 class="text-xl font-bold text-white mb-4 italic gradient-text">Autoryzacja</h3>
                <p class="text-slate-400 text-sm mb-4">Podaj hasło, aby uzyskać dostęp do ustawień.</p>
                <input type="password" id="passwordInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500 transition-colors mb-4" placeholder="••••••••">
                <div class="flex justify-end gap-3">
                    <button id="cancelPasswordBtn" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">Anuluj</button>
                    <button id="submitPasswordBtn" class="px-5 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition-colors">Odblokuj</button>
                </div>
                <p id="passwordError" class="text-red-400 text-xs mt-3 hidden">Nieprawidłowe hasło!</p>
            </div>

            <!-- Settings Form -->
            <div id="offsetModal" class="glass-card p-6 rounded-2xl w-full max-w-sm m-4 shadow-2xl hidden transform scale-95 transition-transform duration-300 relative">
                <button class="absolute top-4 right-4 text-slate-500 hover:text-white" onclick="closeModals()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 class="text-xl font-bold text-white mb-4 italic gradient-text">Panel Administratora</h3>
                <p class="text-slate-400 text-sm mb-5">Wybierz sposób edycji grafiku.</p>
                
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">Szybka Rotacja Tygodni (2T/3T)</label>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <button class="t2-btn py-2 rounded-xl border border-slate-700 text-slate-300 transition-colors" data-val="0">2T: Cykl 1</button>
                            <button class="t2-btn py-2 rounded-xl border border-slate-700 text-slate-300 transition-colors" data-val="1">2T: Cykl 2</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="t3-btn py-2 rounded-xl border border-slate-700 text-slate-300 transition-colors" data-val="0">3T: 1</button>
                            <button class="t3-btn py-2 rounded-xl border border-slate-700 text-slate-300 transition-colors" data-val="1">3T: 2</button>
                            <button class="t3-btn py-2 rounded-xl border border-slate-700 text-slate-300 transition-colors" data-val="2">3T: 3</button>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="openEditorBtn" class="w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-black transition-all shadow-lg flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        PEŁNY EDYTOR GRAFIKU
                    </button>
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <button id="closeSettingsBtn" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors border border-slate-700 text-xs font-bold">ANULUJ</button>
                        <button id="saveSettingsBtn" class="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold border border-cyan-500/30 transition-colors text-xs">SYNCHRONIZUJ CYKL</button>
                    </div>
                </div>
            </div>

            <!-- Full Week Editor Overlay -->
            <div id="editorOverlay" class="fixed inset-0 bg-slate-900 z-[60] hidden flex flex-col p-4 sm:p-8 animate-fade-in overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white italic gradient-text uppercase tracking-tighter">Edytor Całego Tygodnia</h2>
                        <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Zarządzaj nauczycielami, grupami i miejscami zajęć</p>
                    </div>
                    <div class="flex gap-3">
                        <button id="closeEditorBtn" class="px-6 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all font-bold">Zamknij Edytor</button>
                        <button id="saveEditorBtn" class="px-8 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-black transition-all shadow-lg shadow-cyan-900/40">Zapisz i Synchronizuj</button>
                    </div>
                </div>
                <div id="editorGrid" class="flex-1 overflow-auto bg-slate-900 rounded-3xl border border-slate-700/50 relative">
                    <!-- Matrix populated by JS (No internal padding here to allow sticky headers to touch edges) -->
                </div>
            </div>
        `;
        document.body.appendChild(settingsOverlay);

        const settingsBtn = document.getElementById('settingsBtn');
        const passwordModal = document.getElementById('passwordModal');
        const offsetModal = document.getElementById('offsetModal');
        const passInput = document.getElementById('passwordInput');
        
        let tempW2 = 0;
        let tempW3 = 0;

        const closeModals = () => {
            settingsOverlay.classList.remove('opacity-100');
            settingsOverlay.classList.add('opacity-0');
            passwordModal.classList.remove('scale-100');
            passwordModal.classList.add('scale-95');
            offsetModal.classList.remove('scale-100');
            offsetModal.classList.add('scale-95');
            setTimeout(() => settingsOverlay.classList.add('hidden'), 300);
        };

        settingsBtn.addEventListener('click', () => {
            settingsOverlay.classList.remove('hidden');
            setTimeout(() => {
                settingsOverlay.classList.remove('opacity-0');
                settingsOverlay.classList.add('opacity-100');
                passwordModal.classList.remove('scale-95');
                passwordModal.classList.add('scale-100');
            }, 10);
            passInput.value = '';
            document.getElementById('passwordError').classList.add('hidden');
            passwordModal.classList.remove('hidden');
            offsetModal.classList.add('hidden');
            passInput.focus();
        });

        const initListeners = () => {
            const safeAttach = (id, fn) => {
                const el = document.getElementById(id);
                if (el) el.onclick = fn;
            };

            safeAttach('openEditorBtn', () => { 
                passwordModal.classList.add('hidden');
                offsetModal.classList.add('hidden');
                openEditor(); 
            });
            safeAttach('closeEditorBtn', () => { 
                document.getElementById('editorOverlay').classList.add('hidden');
                offsetModal.classList.remove('hidden'); // Return to settings menu
            });
            safeAttach('saveEditorBtn', saveFullEditor);
            safeAttach('cancelPasswordBtn', closeModals);
            safeAttach('closeSettingsBtn', closeModals);
            safeAttach('saveSeedBtn', () => {
                const inputs = document.querySelectorAll('.rotation-input');
                const baseOrder = Array.from(inputs).map(i => i.value.trim()).filter(v => v !== '');
                if (baseOrder.length === 0) return;
                const seed = { baseDate: getMonday(currentDate).toISOString(), baseOrder: baseOrder };
                localStorage.setItem('rotation_seed', JSON.stringify(seed));
                updateState(); closeModals();
            });
            safeAttach('resetRotationBtn', () => {
                if (confirm('Przywrócić ustawienia domyślne? Lokalne zmiany znikną.')) { localStorage.removeItem('rotation_seed'); location.reload(); }
            });
            document.querySelectorAll('.t2-btn').forEach(b => b.onclick = (e) => { tempW2 = parseInt(e.target.dataset.val); updateSettingsUI(); });
            document.querySelectorAll('.t3-btn').forEach(b => b.onclick = (e) => { tempW3 = parseInt(e.target.dataset.val); updateSettingsUI(); });

            const submitBtn = document.getElementById('submitPasswordBtn');
            if (submitBtn) {
                submitBtn.onclick = async () => {
                    document.getElementById('passwordError').classList.add('hidden');
                    const prevText = submitBtn.textContent;
                    submitBtn.textContent = 'Weryfikacja...';
                    try {
                        const token = await decryptToken(passInput.value);
                        // AES-GCM natively throws if the password is wrong.
                        // If we get here, the password was correct.
                        if (token && token.length > 5) {
                            openSettings();
                        } else {
                            throw new Error("Invalid token length");
                        }
                    } catch(e) {
                        console.error("Auth error:", e);
                        document.getElementById('passwordError').classList.remove('hidden');
                    } finally {
                        submitBtn.textContent = prevText;
                    }
                };
            }

            if (passInput) {
                passInput.onkeypress = (e) => {
                    if (e.key === 'Enter') submitBtn.click();
                };
            }
        };

        const TEACHERS = ['G.Grabowska', 'M. Księżna - Michalska', 'A.Krynicka-Ślusarek', 'Ł. Dąbroś', 'B.Leśniak', 'M.Lesiuk'];
        const LOCATIONS = ['sala', 'siłownia', 'basen', 'Loretańska'];
        const LESSON_KEYS = ['l.1', 'l.2', 'l.3', 'l.4', 'l.5', 'l.6', 'l.7', 'l.8'];

        const openEditor = () => {
            document.getElementById('editorOverlay').classList.remove('hidden');
            const grid = document.getElementById('editorGrid');
            grid.innerHTML = '';
            // Ensure no internal padding interferes with sticky headers
            grid.className = 'flex-1 overflow-auto bg-slate-950 rounded-3xl border border-slate-700/50 relative';

            const table = document.createElement('table');
            // Using border-separate with spacing 0 is most reliable for sticky headers
            table.className = 'w-full text-left border-separate border-spacing-0 min-w-[1500px] bg-slate-900';
            
            const header = document.createElement('thead');
            header.className = 'sticky top-0 z-50'; // Higher z-index for the whole header
            const hRow = document.createElement('tr');
            // Corner cell refined: solid background, no transparency, highest z-index
            hRow.innerHTML = `<th class="p-2 border-b border-r border-slate-700 bg-slate-950 text-[10px] uppercase tracking-tighter text-slate-500 w-24 sticky left-0 top-0 z-[60] shadow-lg">Dzień \\ Lekcja</th>`;
            
            LESSON_KEYS.forEach(l => {
                hRow.innerHTML += `<th class="p-2 border-b border-r border-slate-700 bg-slate-950 text-[10px] uppercase tracking-widest text-cyan-400 text-center font-black sticky top-0 z-50 shadow-md">LEKCJA ${l.replace('l.', '')}</th>`;
            });
            header.appendChild(hRow);
            table.appendChild(header);

            const days = Object.keys(daysENtoPL);
            const body = document.createElement('tbody');

            days.forEach(dayKey => {
                const tr = document.createElement('tr');
                // Left column: Solid dark background, distinct border, z-index higher than cells
                tr.innerHTML = `<td class="p-2 border-b border-r border-slate-700 bg-slate-950 font-black text-[10px] text-slate-400 sticky left-0 z-40 uppercase italic shadow-md">${daysENtoPL[dayKey]}</td>`;
                
                LESSON_KEYS.forEach(lName => {
                    const td = document.createElement('td');
                    td.className = 'p-2 border-b border-r border-slate-700 align-top min-w-[250px] bg-slate-900/20';
                    
                    const dayLessons = scheduleData[dayKey] || [];
                    const lessonData = dayLessons.find(d => d.lesson === lName);
                    
                    const cellContainer = document.createElement('div');
                    cellContainer.className = 'space-y-4';
                    cellContainer.dataset.day = dayKey;
                    cellContainer.dataset.lesson = lName;

                    if (lessonData) {
                        lessonData.teachers.forEach((t, tIdx) => {
                            cellContainer.appendChild(createTeacherSlot(t, tIdx));
                        });
                    }

                    const addBtn = document.createElement('button');
                    addBtn.className = 'w-full py-1 text-[10px] text-slate-500 hover:text-cyan-400 uppercase font-black border border-dashed border-slate-700 rounded-lg mt-2';
                    addBtn.textContent = '+ Dodaj Nauczyciela';
                    addBtn.onclick = () => {
                        cellContainer.appendChild(createTeacherSlot({ teacher: TEACHERS[0], groups: [''] }, cellContainer.children.length));
                    };
                    
                    td.appendChild(cellContainer);
                    td.appendChild(addBtn);
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });

            table.appendChild(body);
            grid.appendChild(table);
        };

        const createTeacherSlot = (tData, idx) => {
            const div = document.createElement('div');
            div.className = 'bg-slate-800/80 p-2 rounded-xl border border-slate-700/50 teacher-slot relative group shadow-sm';
            
            // Teacher Select - Contrast improved
            let tHtml = `<select class="w-full bg-slate-900 text-cyan-400 text-[11px] font-black uppercase p-1.5 rounded-lg border border-slate-700 mb-2 teacher-select shadow-inner cursor-pointer">`;
            TEACHERS.forEach(name => {
                tHtml += `<option value="${name}" class="bg-slate-900 text-white" ${name === tData.teacher ? 'selected' : ''}>${name}</option>`;
            });
            tHtml += `</select>`;
            
            const variantContainer = document.createElement('div');
            variantContainer.className = 'space-y-1 variant-container';
            
            tData.groups.forEach((g, gIdx) => {
                variantContainer.appendChild(createVariantRow(g, gIdx));
            });
            
            const addVarBtn = document.createElement('button');
            addVarBtn.className = 'text-[9px] text-slate-500 hover:text-purple-400 mt-1 uppercase font-bold';
            addVarBtn.textContent = '+ Rotacja';
            addVarBtn.onclick = () => variantContainer.appendChild(createVariantRow('', variantContainer.children.length));

            const delBtn = document.createElement('button');
            delBtn.className = 'absolute -right-1 -top-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center';
            delBtn.textContent = '×';
            delBtn.onclick = () => div.remove();

            div.innerHTML = tHtml;
            div.appendChild(variantContainer);
            div.appendChild(addVarBtn);
            div.appendChild(delBtn);
            return div;
        };

        const createVariantRow = (groupStr, idx) => {
            const row = document.createElement('div');
            row.className = 'flex gap-1 items-center variant-row';
            
            const split = groupStr.split(' ');
            const loc = split.length > 1 ? split.slice(-1)[0] : '';
            const gRoot = split.length > 1 ? split.slice(0, -1).join(' ') : groupStr;

            let gHtml = `<input type="text" placeholder="Grupa" class="flex-1 bg-slate-900 text-white text-[10px] p-1.5 rounded-lg border border-slate-700 group-input" value="${gRoot}">`;
            let lHtml = `<select class="w-20 bg-slate-950 text-purple-400 text-[10px] p-1.5 rounded-lg border border-purple-500/30 font-bold loc-select cursor-pointer">`;
            lHtml += `<option value="" class="bg-slate-900 text-slate-500">- Brak -</option>`;
            LOCATIONS.forEach(l => {
                lHtml += `<option value="${l}" class="bg-slate-900 text-white" ${l === loc ? 'selected' : ''}>${l}</option>`;
            });
            lHtml += `</select>`;
            
            const delVar = document.createElement('button');
            delVar.className = 'text-slate-600 hover:text-red-400 text-xs px-1';
            delVar.textContent = '×';
            delVar.onclick = () => row.remove();

            row.innerHTML = `<span class="text-[8px] text-slate-600 w-3">W${idx+1}</span>` + gHtml + lHtml;
            row.appendChild(delVar);
            return row;
        };

        const saveFullEditor = async () => {
            const saveBtn = document.getElementById('saveEditorBtn');
            const prevText = saveBtn.textContent;
            saveBtn.textContent = 'Synchronizacja...';
            saveBtn.disabled = true;

            const fetchWithTimeout = async (url, options, timeout = 15000) => {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(id);
                    return response;
                } catch (e) {
                    clearTimeout(id);
                    throw e;
                }
            };

            const toBase64 = (str) => {
                const bytes = new TextEncoder().encode(str);
                let binary = "";
                for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
                return btoa(binary);
            };

            try {
                const newSchedule = {};
                const grid = document.getElementById('editorGrid');
                const table = grid.querySelector('table');
                if (!table) throw new Error("Błąd: Nie znaleziono tabeli!");

                const rows = Array.from(table.querySelectorAll('tbody tr'));
                rows.forEach((row, rIdx) => {
                    const dayKey = Object.keys(daysENtoPL)[rIdx];
                    if (!dayKey) return;
                    newSchedule[dayKey] = [];
                    const tds = Array.from(row.querySelectorAll('td')).slice(1);
                    tds.forEach((td) => {
                        const container = td.querySelector('div[data-lesson]');
                        if (!container) return;
                        const lName = container.dataset.lesson;
                        const slots = container.querySelectorAll('.teacher-slot');
                        slots.forEach(slot => {
                            const teacher = slot.querySelector('.teacher-select').value;
                            const groups = Array.from(slot.querySelectorAll('.variant-row')).map(v => {
                                const g = v.querySelector('.group-input').value.trim();
                                const l = v.querySelector('.loc-select').value;
                                return l ? `${g} ${l}` : g;
                            }).filter(v => v !== '');
                            if (groups.length > 0) newSchedule[dayKey].push({ lesson: lName, teachers: [{ teacher, groups }] });
                        });
                    });
                    const merged = [];
                    newSchedule[dayKey].forEach(item => {
                        const existing = merged.find(m => m.lesson === item.lesson);
                        if (existing) existing.teachers.push(...item.teachers);
                        else merged.push(item);
                    });
                    newSchedule[dayKey] = merged;
                });

                const pInput = document.getElementById('passwordInput');
                if (!pInput || !pInput.value) throw new Error("Błąd: Hasło jest puste.");

                const token = await decryptToken(pInput.value);
                
                const getRes = await fetchWithTimeout('https://api.github.com/repos/LukaszDabros/Antigravity/contents/schedule-app/schedule_data.js', {
                    headers: { 'Authorization': 'Bearer ' + token, 'Cache-Control': 'no-store' }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    scheduleSha = getData.sha;
                }

                const contentStr = 'const scheduleData = ' + JSON.stringify(newSchedule, null, 2) + ';'; 
                const encodedContent = toBase64(contentStr);

                const res = await fetchWithTimeout('https://api.github.com/repos/LukaszDabros/Antigravity/contents/schedule-app/schedule_data.js', {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Aktualizacja grafiku',
                        content: encodedContent,
                        sha: scheduleSha
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    scheduleSha = data.content.sha;
                    scheduleData = normalizeScheduleData(newSchedule);
                    updateState();
                    alert('SUKCES: Grafik został zapisany!');
                    document.getElementById('editorOverlay').classList.add('hidden');
                    offsetModal.classList.remove('hidden');
                } else {
                    const error = await res.json();
                    alert('BŁĄD GITHUB: ' + (error.message || 'Brak uprawnień'));
                }
            } catch(e) {
                console.error("Save error details:", e);
                alert('BŁĄD: ' + (e.name === 'AbortError' ? 'Przekroczono czas (Timeout)' : e.message));
            } finally {
                saveBtn.textContent = prevText;
                saveBtn.disabled = false;
            }
        };

        async function decryptToken(password) {
            const encryptedToken = '{"salt":"3HJyGc5jU2MZL8lDHHJ8dA==","iv":"sEe2gh3c9rHa3trS","data":"OerBGiKjiVpwsAsLFFyfD/+mMaqvfvzh+4sdxUN3wo9ZVybqaj5E2dL5hdA="}';
            const obj = JSON.parse(encryptedToken);
            const iv = Uint8Array.from(atob(obj.iv), c => c.charCodeAt(0));
            const salt = Uint8Array.from(atob(obj.salt), c => c.charCodeAt(0));
            const data = Uint8Array.from(atob(obj.data), c => c.charCodeAt(0));

            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveBits", "deriveKey"]
            );
            const key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                true,
                ["decrypt"]
            );
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
            return new TextDecoder().decode(decrypted);
        }

        initListeners();

        async function initApp() {
            try {
                // Fetch Config
                const resConfig = await fetch('https://api.github.com/repos/LukaszDabros/Antigravity/contents/schedule-app/config.json?v=' + Date.now(), { cache: 'no-store' });
                if (resConfig.ok) {
                    const data = await resConfig.json();
                    configSha = data.sha;
                    const contentStr = decodeURIComponent(escape(atob(data.content)));
                    const configData = JSON.parse(contentStr);
                    offset2 = configData.offset2 || 0;
                    offset3 = configData.offset3 || 0;
                }

                // Fetch Schedule Data
                const resSched = await fetch('https://api.github.com/repos/LukaszDabros/Antigravity/contents/schedule-app/schedule_data.js?v=' + Date.now(), { cache: 'no-store' });
                if (resSched.ok) {
                    const data = await resSched.json();
                    scheduleSha = data.sha;
                    let contentStr = decodeURIComponent(escape(atob(data.content)));
                    const sI = contentStr.indexOf('{');
                    const eI = contentStr.lastIndexOf('}');
                    if (sI !== -1 && eI !== -1) {
                        const rawData = JSON.parse(contentStr.substring(sI, eI + 1));
                        scheduleData = normalizeScheduleData(rawData);
                    }
                }
            } catch (err) {
                console.warn('Sync issue:', err);
            }
            // Local Fallback
            if (!scheduleData || Object.keys(scheduleData).length === 0) {
                try {
                    const localRes = await fetch('schedule_data.js');
                    if (localRes.ok) {
                        const txt = await localRes.text();
                        const sI = txt.indexOf('{');
                        const eI = txt.lastIndexOf('}');
                        if (sI !== -1 && eI !== -1) { 
                            scheduleData = normalizeScheduleData(JSON.parse(txt.substring(sI, eI + 1))); 
                        }
                    }
                } catch(e) {
                   console.error("Local load failed:", e);
                }
            }
            updateState();
        }

        function normalizeScheduleData(rawData) {
            const normalized = {};
            Object.keys(daysENtoPL).forEach(day => {
                normalized[day] = [];
                const dayEntries = rawData[day] || [];
                dayEntries.forEach(entry => {
                    const lessonName = entry.lesson.toLowerCase().replace(/\s/g, '');
                    if (lessonName.includes('-')) {
                        const parts = lessonName.replace('l.', '').split('-');
                        const start = parseInt(parts[0]);
                        const end = parseInt(parts[1]);
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = start; i <= end; i++) {
                                normalized[day].push({ lesson: `l.${i}`, teachers: JSON.parse(JSON.stringify(entry.teachers)) });
                            }
                        }
                    } else {
                        normalized[day].push({ ...entry, lesson: lessonName.startsWith('l.') ? lessonName : `l.${lessonName}` });
                    }
                });
                normalized[day].sort((a, b) => {
                    const nA = parseInt(a.lesson.replace('l.', ''));
                    const nB = parseInt(b.lesson.replace('l.', ''));
                    return nA - nB;
                });
            });
            return normalized;
        }

        updateState();
        initApp();
    </script>
