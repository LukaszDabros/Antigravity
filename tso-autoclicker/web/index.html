<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSO Royal Auto-Explorer</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="main-window">
        <!-- FRAME -->
        <div class="frame-top"></div>
        <div class="frame-bottom"></div>
        <div class="frame-left"></div>
        <div class="frame-right"></div>
        
        <!-- CONTENT -->
        <div class="parchment">
            <header>
                <h1>Królewski Zarządca Odkrywców</h1>
                <div class="status-bar" id="statusLine">Gotowy do pracy</div>
            </header>

            <div class="bulk-actions">
                <button id="btnSelectAll" class="btn-royal small">ZAZNACZ WSZYSTKICH</button>
                <button id="btnSetAllTasks" class="btn-royal small">USTAW ZADANIE DLA ZAZNACZONYCH</button>
            </div>

            <main>
                <div class="explorer-grid" id="explorerGrid">
                    <!-- Cards will be injected by JS -->
                </div>

                <div class="controls-panel">
                    <button id="btnStart" class="btn-royal green">START & MINIMIZE</button>
                    <button id="btnStop" class="btn-royal red" disabled>STOP</button>
                    <div class="shortcut-hint">Awaryjne zatrzymanie: ESC</div>
                </div>

                <div class="calibration-section">
                    <button id="toggleCalib" class="btn-royal gold-trimmed">
                        ⚙️ Ustawienia Zaawansowane (Opóźnienie)
                    </button>
                    
                    <div id="calibContent" class="calibration-panel collapsed">
                        <div class="slider-group">
                            <div class="slider-row">
                                <span>Czas oczekiwania: <strong id="valLag">4.0</strong>s</span>
                                <input type="range" id="lagBuffer" min="1.0" max="10.0" step="0.5" value="4.0">
                                <p class="hint">Czas przerwy przed wysłaniem kolejnego odkrywcy (lag serwera).</p>
                            </div>
                            <div class="slider-row turbo-row">
                                <label class="turbo-label">
                                    <input type="checkbox" id="chkTurbo">
                                    <span>Tryb Turbo ⚡ (Błyskawiczne wysyłanie)</span>
                                </label>
                                <p class="hint">Bot klika kolejnych odkrywców bez czekania na lag.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal" style="display:none;">
        <div class="modal-parchment">
             <h2>Ustawienia Misji</h2>
             <p>Wybierz co ma robić ten odkrywca:</p>
             <select id="taskSelect">
                 <option value="short_treasure">Krótki Skarb</option>
                 <option value="medium_treasure">Średni Skarb</option>
                 <option value="long_treasure">Długi Skarb</option>
                 <option value="very_long_treasure">B. Długi Skarb</option>
                 <option value="prolonged_treasure">Przedłużony Skarb</option>
                 <option value="artifact_treasure">Artefakty</option>
                 <option value="adventure">Przygoda</option>
             </select>
             <button id="saveTask" class="btn-royal">ZAPISZ</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
